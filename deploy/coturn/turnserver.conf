# ─────────────────────────────────────────────────────────────────────────────
# coturn configuration for BookMyTime video consultations.
#
# Replace every <PLACEHOLDER> before starting. The three that matter most:
#   <PUBLIC_IP>        the server's public IPv4 address
#   <TURN_REALM>       your domain, e.g. turn.bookmytime.tech
#   <SHARED_SECRET>    long random string; must equal TURN_SHARED_SECRET in .env
#
# Generate a secret with:  openssl rand -hex 32
# ─────────────────────────────────────────────────────────────────────────────

# ── Listening ────────────────────────────────────────────────────────────────
listening-port=3478
# TLS port. Serving TURN over 443/5349 is what gets calls through restrictive
# corporate and hotel networks that block UDP entirely.
tls-listening-port=5349

# The public address clients should use. On a NAT'd cloud VM set both:
#   listening-ip = the private/bound address, external-ip = the public one.
listening-ip=0.0.0.0
external-ip=<PUBLIC_IP>

# ── Relay ────────────────────────────────────────────────────────────────────
# Relay port range must be OPEN IN YOUR FIREWALL / SECURITY GROUP (UDP).
# 10000-20000 supports a large number of concurrent 1:1 calls.
min-port=10000
max-port=20000

# ── Authentication ───────────────────────────────────────────────────────────
# REST API / ephemeral credential mode. The application mints short-lived
# HMAC-SHA1 credentials from this secret; no long-lived user accounts exist and
# the secret never reaches a browser.
use-auth-secret
static-auth-secret=<SHARED_SECRET>
realm=<TURN_REALM>

# ── TLS (recommended) ────────────────────────────────────────────────────────
# Obtain certs with certbot, then uncomment and mount ./certs in compose.
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
# Modern ciphers only.
# cipher-list="ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM"

# ── Hardening ────────────────────────────────────────────────────────────────
# This server relays media only. Deny relaying to internal/link-local ranges so
# it can never be used to reach your private network or cloud metadata service.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# No TURN admin/CLI surface.
no-cli
# We do not use the legacy long-term credential DB.
no-sqlite

# Reasonable per-user ceilings to blunt abuse of a leaked credential.
user-quota=12
total-quota=1200
# Bytes-per-second per allocation (0 = unlimited). ~500 KB/s is ample for 1:1 HD.
max-bps=500000

# ── Logging ──────────────────────────────────────────────────────────────────
log-file=stdout
simple-log
# Uncomment temporarily when debugging connectivity; very chatty.
# verbose
